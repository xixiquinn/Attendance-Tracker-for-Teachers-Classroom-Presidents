<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in · Attendance Tracker</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#2f6fed">
<style>
:root{box-sizing:border-box;--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#d9dde5;--ac:#2f6fed;--err:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#14161b;--card:#1d2027;--tx:#e8eaf0;--mut:#9aa1b2;--bd:#343945;--ac:#6b9bff;--err:#ff8a7a}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
.wm{position:fixed;top:env(safe-area-inset-top,0px);left:0;padding:5px 10px;font-size:.75rem;font-weight:600;color:var(--mut);opacity:.8;pointer-events:none;user-select:none}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px 24px}
.logo{width:56px;height:56px;border-radius:14px;display:block;margin:0 auto 14px}
h1{font-size:1.3rem;margin:0;text-align:center}
.sub{text-align:center;color:var(--mut);margin:4px 0 22px;font-size:.9rem}
label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px}
input{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
input:focus{outline:2px solid var(--ac);outline-offset:1px}
.pw{position:relative}
.pw input{padding-right:70px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ac);font:inherit;font-size:.85rem;font-weight:600;padding:8px;cursor:pointer}
.go{width:100%;margin-top:22px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;padding:13px;cursor:pointer}
.go:disabled{opacity:.6;cursor:default}
.err{min-height:1.4em;margin:12px 0 0;color:var(--err);font-size:.9rem;text-align:center}
.foot{margin-top:18px;text-align:center;color:var(--mut);font-size:.8rem}
</style></head><body>
<div class="wm">Made by Quinn</div>
<main class="box">
  <img class="logo" src="/icon-192.png" alt="">
  <h1>Attendance Tracker</h1>
  <p class="sub">for Teachers &amp; Classroom Presidents</p>
  <form id="f" novalidate>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus>
    <label for="p">Password</label>
    <div class="pw">
      <input id="p" name="password" type="password" autocomplete="current-password">
      <button type="button" id="show" aria-label="Show password">Show</button>
    </div>
    <p class="err" id="err" role="alert"></p>
    <button class="go" id="go" type="submit">Log in</button>
  </form>
  <p class="foot">Ask your administrator if you need an account.</p>
</main>
<script>
const $=id=>document.getElementById(id);
$('show').onclick=()=>{const t=$('p').type==='password';$('p').type=t?'text':'password';$('show').textContent=t?'Hide':'Show'};
$('f').onsubmit=async e=>{
  e.preventDefault();$('err').textContent='';
  const u=$('u').value.trim(),p=$('p').value;
  if(!u||!p){$('err').textContent='Enter your username and password.';return}
  $('go').disabled=true;$('go').textContent='Logging in…';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){location.replace('/');return}
    $('err').textContent=d.error||'Could not log in. Please try again.';
  }catch(x){$('err').textContent='No connection. Check your internet and try again.'}
  $('go').disabled=false;$('go').textContent='Log in';$('p').focus();
};
</script></body></html>
